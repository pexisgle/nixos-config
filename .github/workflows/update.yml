name: update

on:
  schedule:
    # JST 毎週月曜 09:00 (UTC 月曜 00:00)
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: "What to update"
        required: true
        type: choice
        default: flake
        options:
          - flake
      dry_run:
        description: "Dry run (no commit, no PR)"
        required: false
        type: boolean
        default: false

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  update:
    name: Update (${{ inputs.target || 'flake' }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v1
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache Nix store in FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v1

      - name: Configure upstream Cachix caches
        uses: cachix/cachix-action@v17
        with:
          name: codex-desktop-linux

      - name: Configure repository Cachix cache
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@v17
        with:
          name: pexisgle
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Enable unfree packages
        run: |
          mkdir -p ~/.config/nix
          cat >> ~/.config/nix/nix.conf <<EOF
          experimental-features = nix-command flakes
          EOF
          echo "NIXPKGS_ALLOW_UNFREE=1" >> "$GITHUB_ENV"

      - name: Update flake.lock
        run: nix flake update

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- flake.lock flake.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No updates available."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- flake.lock flake.nix
          fi

      - name: Build configurations (sanity check + cache warmup)
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != 'true'
        run: |
          echo "Building NixOS system configurations..."
          nix build --no-link --print-build-logs .#nixosConfigurations.pexisgle-desktop.config.system.build.toplevel
          nix build --no-link --print-build-logs .#nixosConfigurations.pexisgle-laptop.config.system.build.toplevel

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          title: "chore(update): automated dependency & package update"
          body: |
            Automated update run: ${{ github.run_id }}

            Trigger: `${{ github.event_name }}` (${{ github.event.schedule || 'workflow_dispatch' }})

            **Targets updated:**
            - flake.lock (`nix flake update`)

            Please review the diff and merge if all looks good. The host rebuild can be done with `nixos-rebuild switch --flake .#pexisgle-desktop`.

            ---
            *This PR was generated by the `update` workflow.*
          branch: update/automated
          commit-message: "chore(update): apply updates"
          add-paths: |
            flake.lock
            flake.nix
          delete-branch: true

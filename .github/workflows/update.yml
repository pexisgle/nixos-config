name: update

on:
  schedule:
    # JST 毎週月曜 09:00 (UTC 月曜 00:00)
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: "What to update"
        required: true
        type: choice
        default: all
        options:
          - all
          - flake
          - pkgs
          - opencodex
          - github-desktop-plus
      dry_run:
        description: "Dry run (no commit, no PR)"
        required: false
        type: boolean
        default: false

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  update:
    name: Update (${{ inputs.target || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v1
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-substitution-jobs = 64
            http-connections = 50

      - name: Cache Nix store in FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v1

      - name: Configure repository Cachix cache
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@v17
        with:
          name: pexisgle
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,niri,lanzaboote,quickshell,devenv,nix-gaming,hyprland

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable unfree packages
        run: |
          mkdir -p ~/.config/nix
          cat >> ~/.config/nix/nix.conf <<EOF
          experimental-features = nix-command flakes
          EOF
          echo "NIXPKGS_ALLOW_UNFREE=1" >> "$GITHUB_ENV"

      - name: Run updaters
        env:
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: |
          ./scripts/update.sh "${{ inputs.target || 'all' }}"

      - name: Lint and evaluate (fmt + flake check)
        run: |
          echo "Checking Nix formatting..."
          # hardware-configuration.nix is generated output; keep it unformatted.
          nix run --inputs-from . nixpkgs#nixfmt -- --check $(git ls-files '*.nix' | grep -v hardware-configuration)
          echo "Evaluating flake..."
          nix flake check --no-build
          echo "Checking flake/lib cache mirror..."
          ./scripts/check-caches.sh

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- flake.lock flake.nix pkgs/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No updates available."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "### Changes detected:" >> "$GITHUB_STEP_SUMMARY"
            echo '```diff' >> "$GITHUB_STEP_SUMMARY"
            git diff --stat -- flake.lock flake.nix pkgs/ >> "$GITHUB_STEP_SUMMARY"

            {
              echo "diff_stat<<EOF"
              git diff --stat -- flake.lock flake.nix pkgs/
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build configurations (sanity check + cache warmup)
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != 'true'
        run: |
          echo "Building NixOS system configurations..."
          nix build --no-link --print-build-logs \
            .#nixosConfigurations.pexisgle-desktop.config.system.build.toplevel \
            .#nixosConfigurations.pexisgle-laptop.config.system.build.toplevel

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          title: "chore(update): automated dependency & package update"
          body: |
            Automated update run: ${{ github.run_id }}

            Trigger: `${{ github.event_name }}` (${{ github.event.schedule || 'workflow_dispatch' }})
            Target: `${{ inputs.target || 'all' }}`

            **Summary of changes:**
            ```
            ${{ steps.diff.outputs.diff_stat }}
            ```

            Please review the diff and merge if all looks good. The host rebuild can be done with `nixos-rebuild switch --flake .#pexisgle-desktop`.

            ---
            *This PR was generated by the `update` workflow.*
          branch: update/automated
          commit-message: "chore(update): apply automated updates"
          add-paths: |
            flake.lock
            flake.nix
            pkgs/**
          delete-branch: true

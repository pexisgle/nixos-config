name: cache

on:
  push:
    branches:
      - main
    paths:
      - "flake.nix"
      - "flake.lock"
      - "hosts/**"
      - "modules/**"
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/cache.yml"
  workflow_dispatch:

concurrency:
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v1
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-substitution-jobs = 64
            http-connections = 50
            download-buffer-size = 67108864
            substituters = https://cache.nixos.org https://pexisgle.cachix.org https://cache.numtide.com https://nix-community.cachix.org https://niri.cachix.org https://lanzaboote.cachix.org https://quickshell.cachix.org https://devenv.cachix.org https://nix-gaming.cachix.org https://hyprland.cachix.org
            trusted-substituters = https://cache.nixos.org https://pexisgle.cachix.org https://cache.numtide.com https://nix-community.cachix.org https://niri.cachix.org https://lanzaboote.cachix.org https://quickshell.cachix.org https://devenv.cachix.org https://nix-gaming.cachix.org https://hyprland.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= pexisgle.cachix.org-1:6IcVMm0m93b5M6O7aA4lN6/DhfxepMHeivvLeTd6Yko= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niri.cachix.org-1:Wv0OmO7PsuocRKzfDoJ3mulSl7Z6oezYhGhR+3W2964= lanzaboote.cachix.org-1:Nt9//zGmqkg1k5iu+B3bkj3OmHKjSw9pvf3faffLLNk= quickshell.cachix.org-1:vBm3s5tZThc5KDLj6zhHVCMp8wX/AZJwle9wqdi81ts= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= nix-gaming.cachix.org-1:nbjlureqMbRAxR1gJ/f3hxemL9svXaZF/Ees8vCUUs4= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=

      - name: Configure repository Cachix cache
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@v17
        with:
          name: pexisgle
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,niri,lanzaboote,quickshell,devenv,nix-gaming,hyprland

      - name: Explain missing Cachix token
        if: env.CACHIX_AUTH_TOKEN == ''
        run: echo "CACHIX_AUTH_TOKEN is not configured; builds will be validated but not uploaded to the pexisgle cache."

      - name: Enable unfree packages
        run: echo "NIXPKGS_ALLOW_UNFREE=1" >> "$GITHUB_ENV"

      - name: Lint and evaluate (fmt + flake check)
        run: |
          echo "Checking Nix formatting..."
          # hardware-configuration.nix is generated output; keep it unformatted.
          nix run --inputs-from . nixpkgs#nixfmt -- --check $(git ls-files '*.nix' | grep -v hardware-configuration)
          echo "Evaluating flake..."
          nix flake check --no-build
          echo "Checking flake/lib cache mirror..."
          ./scripts/check-caches.sh

      - name: Build NixOS system closures
        run: |
          nix build --no-link --print-build-logs \
            --option builders-use-substitutes true \
            .#nixosConfigurations.pexisgle-desktop.config.system.build.toplevel \
            .#nixosConfigurations.pexisgle-laptop.config.system.build.toplevel
